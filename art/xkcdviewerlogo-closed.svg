<svg xmlns="http://www.w3.org/2000/svg" viewBox="84 116 332 332" width="100%" height="100%">
  <!-- The xkcdviewer logo with its eyes closed: art/xkcdviewerlogo.svg with the eyes swapped for closed lids. The
       New Comic key shows it while there's nothing new to see (KeyRenderer.Logo). Same viewBox and strokes as the
       original, so the two line up exactly. -->
  <g fill="none" stroke="#111111" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Closed eyes: each a lid drawn as a downward curve where the open eye's middle was, with three short lashes.
         Used on the New Comic key while there's nothing new to see (KeyRenderer.Logo). -->
    <path d="M 132 186 C 150 222, 212 222, 228 186" />
    <path d="M 272 186 C 288 222, 350 222, 368 186" />

    <path d="M 152 210 L 144 228" />
    <path d="M 180 218 L 179 238" />
    <path d="M 208 210 L 216 228" />

    <path d="M 292 210 L 284 228" />
    <path d="M 320 218 L 319 238" />
    <path d="M 348 210 L 356 228" />

    <!-- ==================== "xkcd" Typography ==================== -->
    
    <!-- 'x' -->
    <path d="M 105 348 C 122 378, 140 405, 155 428" />
    <path d="M 152 350 C 135 378, 118 406, 102 428" />

    <!-- 'k' -->
    <path d="M 195 305 C 196 345, 194 385, 195 428" />
    <path d="M 242 352 C 224 376, 206 388, 196 390" />
    <path d="M 210 384 C 224 402, 238 418, 250 428" />

    <!-- 'c' -->
    <path d="M 328 358 C 304 340, 274 350, 272 388 C 270 422, 298 436, 328 420" />

    <!-- 'd' -->
    <path d="M 398 305 C 397 345, 398 385, 398 428" />
    <path d="M 396 424 C 366 432, 344 412, 344 388 C 344 362, 368 350, 395 356" />

  </g>
</svg>
